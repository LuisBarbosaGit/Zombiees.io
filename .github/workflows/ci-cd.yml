name: CI and EC2 deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test frontend and game core
        run: npm test
      - name: Test API
        run: npm run test:api
      - name: Build frontend
        run: npm run build
      - name: Build API
        run: npm run build:api
      - name: Verify Docker image builds
        run: docker build --file server/Dockerfile --tag zombies-io-api:ci .

  deploy-ec2:
    name: Deploy backend to EC2
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_EC2_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure temporary AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx create --use
          docker buildx build \
            --platform linux/amd64 \
            --file server/Dockerfile \
            --tag "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            --push .
      - name: Deploy image on EC2 through Systems Manager
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_EC2_INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          REMOTE_COMMANDS=$(cat <<EOF
          set -eu
          test -s /opt/zombies-io/.env || { echo "Crie /opt/zombies-io/.env com a configuração do Supabase antes do deploy."; exit 1; }
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/LuisBarbosaGit/Zombiees.io/${IMAGE_TAG}/compose.ec2.yaml" --output /opt/zombies-io/compose.yaml
          cd /opt/zombies-io
          export ECR_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${AWS_ECR_REPOSITORY}:${IMAGE_TAG}"
          docker compose --file compose.yaml pull
          docker compose --file compose.yaml up --detach --remove-orphans
          docker image prune --force
          EOF
          )
          PARAMETERS=$(jq -n --arg command "${REMOTE_COMMANDS}" '{commands: [$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "${AWS_EC2_INSTANCE_ID}" \
            --parameters "${PARAMETERS}" \
            --comment "Deploy Zombies.io backend ${IMAGE_TAG}" \
            --query 'Command.CommandId' \
            --output text)
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${AWS_EC2_INSTANCE_ID}" \
              --query Status \
              --output text 2>/dev/null || true)
            case "${STATUS}" in
              Success) echo "EC2 deploy concluído."; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${AWS_EC2_INSTANCE_ID}" --output json
                exit 1
                ;;
              *) echo "Aguardando comando SSM (${STATUS:-Pending})..."; sleep 10 ;;
            esac
          done
          echo "Timeout aguardando o deploy via SSM."
          exit 1
