name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test frontend and game core
        run: npm test
      - name: Test API
        run: npm run test:api
      - name: Build frontend
        run: npm run build
      - name: Build API
        run: npm run build:api
      - name: Verify Docker image builds
        run: docker build --file server/Dockerfile --tag zombies-io-api:ci .
